name: Ajustar janela de agendamento para 30 dias

on:
  push:
    paths:
      - '.github/workflows/patch-booking-30-days.yml'

permissions:
  contents: write

jobs:
  patch-booking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajustar apenas a janela de datas
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/Booking.tsx')
          text = path.read_text(encoding='utf-8')

          old = """function generateDates() {
            const dates: Date[] = []
            const today = new Date()
            const lastDayOfMonth = new Date(
              today.getFullYear(),
              today.getMonth() + 1,
              0,
            ).getDate()

            for (let day = today.getDate(); day <= lastDayOfMonth; day++) {
              dates.push(new Date(today.getFullYear(), today.getMonth(), day))
            }

            return dates
          }"""

          new = """function generateDates() {
            const dates: Date[] = []
            const today = new Date()

            for (let i = 0; i < 30; i++) {
              const d = new Date(today)
              d.setDate(today.getDate() + i)
              dates.push(d)
            }

            return dates
          }"""

          if old not in text:
            raise SystemExit('Trecho esperado de generateDates não encontrado; nenhuma alteração foi feita.')

          text = text.replace(old, new, 1)
          text = text.replace(
            'Não há mais horários disponíveis neste mês ♡',
            'Não há horários disponíveis nos próximos 30 dias ♡',
            1,
          )

          path.write_text(text, encoding='utf-8')

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Booking.tsx
          git diff --cached --exit-code && exit 0
          git commit -m "fix: usa janela móvel de 30 dias no agendamento"
          git push
